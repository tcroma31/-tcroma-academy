<title>TCROMA ACADEMY V4.1.2 — LES COMPÉTITIONS</title>
<style>
*{box-sizing:border-box}
:root{--bg:#06140d;--card:#10291b;--card2:#183b27;--line:#2b5a3c;--txt:#f5fbf7;--muted:#b7cbbc;--gold:#f4cb47;--red:#8c3434;--green:#2bb768;--blue:#3674c8}
body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:var(--txt);background:radial-gradient(circle at top,#164a2e 0,#07180f 38%,var(--bg) 100%)}
.wrap{width:min(1050px,100%);margin:auto;padding:18px 14px 60px}
.card{background:rgba(16,41,27,.97);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:0 15px 35px rgba(0,0,0,.24)}
.center{text-align:center}.hidden{display:none!important}h1,h2,h3{margin-top:0}.muted{color:var(--muted)}
.hero{min-height:75vh;display:grid;place-items:center}.hero .card{max-width:740px;width:100%;padding:38px}
button{width:100%;padding:13px 15px;margin-top:10px;border:0;border-radius:12px;background:var(--gold);font-weight:800;font-size:16px;cursor:pointer;color:#171307}
button.secondary{background:var(--card2);border:1px solid var(--line);color:var(--txt)}
button.danger{background:var(--red);color:white}
button.blue{background:var(--blue);color:white}
input,select{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:#081a10;color:var(--txt);font-size:16px;margin-top:6px}
label{display:block;margin-top:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.header{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;flex-wrap:wrap}
.badges{display:flex;gap:8px;flex-wrap:wrap}.badge{padding:8px 12px;border-radius:999px;background:var(--card2);border:1px solid var(--line)}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px}.tab{margin:0;background:var(--card2);color:var(--txt);border:1px solid var(--line)}.tab.active{background:var(--gold);color:#171307}
.message{padding:14px;border-left:4px solid var(--gold);background:#071a10;border-radius:10px;line-height:1.55;margin:12px 0}
.score{font-size:28px;font-weight:900;text-align:center;margin:16px 0}.big{font-size:21px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:center}th:first-child,td:first-child{text-align:left}.mine{background:rgba(244,203,71,.16);font-weight:700}
.stat{display:grid;grid-template-columns:155px 1fr 45px;gap:10px;align-items:center;margin:10px 0}.bar{height:10px;background:#284a35;border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--gold))}
.journal{padding:12px 0;border-bottom:1px solid var(--line)}.choice button{margin-top:8px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:var(--card2);margin:3px}.positive{color:#83e3a7}.negative{color:#ff9b9b}
.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.trophy{padding:12px;border:1px solid var(--line);border-radius:12px;background:#0a1e13;margin:8px 0}.money{font-size:22px;font-weight:800}.report-box{padding:14px;background:#0a1e13;border-radius:14px;border:1px solid var(--line)}.competition-card{padding:15px;border:1px solid var(--line);border-radius:14px;background:#0a1e13;margin:10px 0}.competition-card.eliminated{opacity:.62}.competition-card.winner{border-color:var(--gold);box-shadow:0 0 0 1px rgba(244,203,71,.25)}.round-chip{display:inline-block;padding:5px 9px;border-radius:999px;background:var(--card2);margin:3px}
@media(max-width:700px){.grid2,.grid3,.report-grid{grid-template-columns:1fr}.tabs{grid-template-columns:repeat(2,1fr)}.stat{grid-template-columns:110px 1fr 38px}.hero .card{padding:24px}}
</style>
</head>

</section>

<section id="game" class="hidden">

    <button class="tab" data-tab="journal">Journal</button>

function competitionIdsForPlayer(p){
  if(p.age<=15)return ['district','regionalYouth'];
  if(p.age<=17)return ['regionalYouth','gambardella'];
  if(p.age===18)return p.pro?['gambardella','nationalCup']:['gambardella','occitanie','france'];
  if(p.pro){
    const ids=['nationalCup'];
    if((p.clubPrestige||0)>=72)ids.push('champions');
    return ids;
  }
  return ['occitanie','france'];
}

function createCompetition(id){
  const d=COMPETITION_DEFINITIONS[id];
  return {
    id,
    name:d.name,
    rounds:[...d.rounds],
    dates:[...d.dates],
    pool:d.pool,
    prestige:d.prestige,
    currentRound:0,
    alive:true,
    winner:false,
    opponent:'',
    drawPending:false,
    matchPending:false,
    playedRounds:[],
    stats:{matches:0,goals:0,assists:0,ratings:0,motm:0},
    bestRound:'Non commencé',
    history:[]
  };
}

function initializeCompetitions(force=false){
  if(!state||!state.player||!state.season)return;
  const expected=competitionIdsForPlayer(state.player);
  if(force||!state.competitions||!Array.isArray(state.competitions.active)){
    state.competitions={
      active:expected.map(createCompetition),
      calendar:[],
      trophies:[],
      records:[]
    };
  }else{
    for(const id of expected){
      if(!state.competitions.active.some(c=>c.id===id)){
        state.competitions.active.push(createCompetition(id));
      }
    }
  }
}

function activeCompetitionDue(){
  initializeCompetitions();
  const round=state.season.round;
  return state.competitions.active.find(c=>
    c.alive&&!c.winner&&
    c.currentRound<c.rounds.length&&
    c.dates[c.currentRound]===round&&
    !c.playedRounds.includes(c.currentRound)
  )||null;
}

function competitionOpponent(c){
  const pool=COMPETITION_OPPONENTS[c.pool]||COMPETITION_OPPONENTS.amateur;
  const candidates=pool.filter(x=>x!==state.player.club);
  return pick(candidates);
}

function prepareCompetitionDraw(c){

  c.drawPending=true;

}

function competitionChance(c){
  const p=state.player;
  const avg=(p.tech+p.speed+p.physical+p.mental)/4;
  let chance=.48+(avg-55)/150+(p.form-50)/220+(p.coach-50)/300-p.fatigue/500;
  if(c.id==='france'&&['Toulouse FC','Montpellier HSC','AS Monaco','Lille OSC','Olympique Lyonnais','Olympique de Marseille','Paris SG'].includes(c.opponent)){
    chance-=.18;
  }
  if(c.id==='champions')chance-=.06;
  return clamp(chance,.12,.86);
}

function playCompetitionMatch(c){
  const p=state.player;
  const chance=competitionChance(c);
  const qualified=Math.random()<chance;
  let teamGoals=rand(0,3),oppGoals=rand(0,3);
  let extraTime=false,penalties=false,penScore='';

  if(qualified&&teamGoals<=oppGoals)teamGoals=oppGoals+1;
  if(!qualified&&teamGoals>=oppGoals)oppGoals=teamGoals+1;

  if(Math.random()<.32){
    teamGoals=oppGoals=rand(0,2);
    extraTime=true;
    if(Math.random()<.48){
      penalties=true;
      if(qualified)penScore=`${rand(4,6)}-${rand(2,4)}`;
      else penScore=`${rand(2,4)}-${rand(4,6)}`;
    }else{
      if(qualified)teamGoals++;
      else oppGoals++;
    }
  }

  const home=Math.random()<.5;
  const score=home
    ?`${p.club} ${teamGoals}-${oppGoals} ${c.opponent}`
    :`${c.opponent} ${oppGoals}-${teamGoals} ${p.club}`;

  const perf=(p.tech+p.speed+p.physical+p.mental)/4+p.form*.18-p.fatigue*.18+Math.random()*25;
  const note=clamp(5.1+(perf-50)/22+(qualified?.45:-.35),3.5,9.6);
  let goals=0,assists=0;
  if(role()!=='GK'){
    goals=Math.random()<(role()==='ATT'?.34:role()==='MID'?.18:.08)?1:0;
    assists=Math.random()<(role()==='MID'?.30:role()==='ATT'?.20:.10)?1:0;
  }
  if(goals>teamGoals)goals=teamGoals;
  if(assists>Math.max(0,teamGoals-goals))assists=Math.max(0,teamGoals-goals);

  c.stats.matches++;
  c.stats.goals+=goals;
  c.stats.assists+=assists;
  c.stats.ratings+=note;
  if(note>=8)c.stats.motm++;

  p.matches++;
  p.goals+=goals;
  p.assists+=assists;
  p.sumRating+=note;
  if(note>=8)p.motm++;

  p.fatigue=clamp(p.fatigue+(role()==='GK'?rand(1,3):rand(3,6)));

  const roundName=c.rounds[c.currentRound];
  c.bestRound=roundName;
  c.history.unshift({
    age:p.age,round:roundName,opponent:c.opponent,score,
    qualified,note:note.toFixed(1),extraTime,penalties,penScore
  });
  c.playedRounds.push(c.currentRound);

  let text=`${score}. Note ${note.toFixed(1)}/10.`;
  if(extraTime)text+=' Prolongation.';
  if(penalties)text+=` Tirs au but : ${penScore}.`;
  if(goals)text+=` Tu marques ${goals} but${goals>1?'s':''}.`;
  if(assists)text+=` ${assists} passe${assists>1?'s':''} décisive${assists>1?'s':''}.`;

  if(qualified){
    if(c.currentRound===c.rounds.length-1){
      c.winner=true;c.alive=false;
      const trophy=`${c.name} — ${p.age} ans`;
      p.titles.push(trophy);
      state.competitions.trophies.push(trophy);
      p.reputation=clamp(p.reputation+c.prestige);
      text+=` 🏆 Tu remportes ${c.name} !`;
    }else{
      c.currentRound++;
      c.opponent='';
      c.drawPending=false;
      c.matchPending=false;
      p.reputation=clamp(p.reputation+Math.max(1,Math.round(c.prestige/8)));
      text+=' Qualification pour le tour suivant.';
    }
  }else{
    c.alive=false;
    c.drawPending=false;
    c.matchPending=false;
    text+=` Élimination en ${roundName}.`;
  }

  state.season.lastCompetitionResult={
    competition:c.name,round:roundName,score,qualified,note,goals,assists,
    extraTime,penalties,penScore,text
  };
  state.season.phase='competitionResult';
  log(c.name,text);
}

function load(){
  try{
    let raw=localStorage.getItem(SAVE_KEY);
    if(!raw){
      for(const key of LEGACY_SAVE_KEYS){
        raw=localStorage.getItem(key);
        if(raw)break;
      }
    }
    const data=JSON.parse(raw);
    const normalized=normalizeState(data);
    if(normalized)localStorage.setItem(SAVE_KEY,JSON.stringify(normalized));
    return normalized;
  }catch{

  }
}

function normalizeState(data){

  p.tournaments = Array.isArray(p.tournaments) ? p.tournaments : [];
  p.awards = Array.isArray(p.awards) ? p.awards : [];
  p.honours = Array.isArray(p.honours) ? p.honours : [];
  p.offers = Array.isArray(p.offers) ? p.offers : [];
  p.balance = Number(p.balance) || 0;
  p.totalIncome = Number(p.totalIncome) || 0;
  p.totalExpenses = Number(p.totalExpenses) || 0;
  p.careerPath = p.careerPath || 'Jeunes';
  p.agent = p.agent || {name:'Famille',level:0,commission:0};
  p.poleStatus = p.poleStatus || (p.pole ? 'Retenu' : p.poleAttempted ? 'Non retenu' : 'À venir');
  p.transferHistory=Array.isArray(p.transferHistory)?p.transferHistory:[];
  p.clubTrials=Array.isArray(p.clubTrials)?p.clubTrials:[];
  p.offers=Array.isArray(p.offers)?p.offers:[];
  p.marketMessage=p.marketMessage||'';
  p.regionalDecisionPending=Boolean(p.regionalDecisionPending);
  p.licenseRenewed=Boolean(p.licenseRenewed);
  p.agent=p.agent||{id:'family',name:'La famille',level:0,commission:0,network:'Clubs locaux'};
  p.pressHistory=Array.isArray(p.pressHistory)?p.pressHistory:[];
  p.proAwards=Array.isArray(p.proAwards)?p.proAwards:[];
  p.proSeasonStats=p.proSeasonStats||{matches:0,goals:0,assists:0,rating:0};
  p.proLeague=p.proLeague||'';
  p.clubPrestige=Number(p.clubPrestige)||0;
  p.europeanMatches=Number(p.europeanMatches)||0;
  p.europeanGoals=Number(p.europeanGoals)||0;
  p.europeanAssists=Number(p.europeanAssists)||0;
  p.pressReputation=Number(p.pressReputation)||0;
  p.goldenBallWins=Number(p.goldenBallWins)||0;
  p.longInjury=Boolean(p.longInjury);
  p.rehabWeeks=Number(p.rehabWeeks)||0;
  p.careerEnded=Boolean(p.careerEnded);
  p.coachProfile=p.coachProfile||pick(COACH_PROFILES);

  p.leadership=clamp(Number(p.leadership)||25);
  p.captain=Boolean(p.captain);
  p.viceCaptain=Boolean(p.viceCaptain);
  p.friendship=clamp(Number(p.friendship)||50);
  p.rivalry=clamp(Number(p.rivalry)||0);
  p.staffRelation=clamp(Number(p.staffRelation)||50);
  p.injuryProtection=clamp(Number(p.injuryProtection)||0);
  p.conflicts=Number(p.conflicts)||0;
  p.lockerHistory=Array.isArray(p.lockerHistory)?p.lockerHistory:[];
  p.staffHistory=Array.isArray(p.staffHistory)?p.staffHistory:[];
  p.travelHistory=Array.isArray(p.travelHistory)?p.travelHistory:[];
  p.currentStaff=Array.isArray(p.currentStaff)&&p.currentStaff.length?p.currentStaff:[...STAFF_MEMBERS];

  s.round = Math.max(1, Number(s.round) || 1);
  s.phase = [
    'preseason','life','training','prematch','action','ready',
    'result','midReport'
  ].includes(s.phase) ? s.phase : 'preseason';

    automatiquement la préparation.

  if(s.phase==='preseason' && s.round>1){

function freshTeam(name){
  return {name,played:0,w:0,d:0,l:0,gf:0,ga:0,pts:0};
}

function schedule(clubs){
  let rot=[...clubs], first=[];
  for(let r=0;r<clubs.length-1;r++){
    let games=[];
    for(let i=0;i<clubs.length/2;i++){
      let a=rot[i], b=rot[clubs.length-1-i];
      games.push(r%2 ? {home:b,away:a} : {home:a,away:b});
    }
    first.push(games);
    rot=[rot[0],rot[rot.length-1],...rot.slice(1,-1)];
  }
  return [...first,...first.map(day=>day.map(g=>({home:g.away,away:g.home})))];
}

function makeLeague(club,level){
  let clubs;
  if(level==='National jeunes'){
    clubs=[...NATIONAL];
    if(!clubs.includes(club)) clubs[0]=club;
  }else if(level==='Championnat professionnel'){const proClubs=['Toulouse FC','Montpellier HSC','Rodez AF','Pau FC','AS Monaco','Lille OSC','Bordeaux','Nîmes','Guingamp','Grenoble'];clubs=[club,...proClubs.filter(c=>c!==club)].slice(0,10)}else if(level==='Seniors régionaux'){
    clubs=[club,...SENIOR_REGIONAL.filter(c=>c!==club)].slice(0,10);
  }else{
    clubs=[club,...REGIONAL.filter(c=>c!==club)].slice(0,10);
  }
  return {level,clubs,table:clubs.map(freshTeam),schedule:schedule(clubs)};
}

  const round = Math.max(1, Number(state.season.round) || 1);
  const day = state.league.schedule?.[round - 1];

    g => g.home === state.player.club || g.away === state.player.club
  ) || null;

function updateTeam(name,gf,ga){
  const t=state.league.table.find(x=>x.name===name);
  if(!t) return;
  t.played++; t.gf+=gf; t.ga+=ga;
  if(gf>ga){t.w++;t.pts+=3}
  else if(gf===ga){t.d++;t.pts++}
  else t.l++;
}

function record(home,away,h,a){
  updateTeam(home,h,a);
  updateTeam(away,a,h);
}

function simulateOthers(){
  for(const g of state.league.schedule[state.season.round-1]||[]){
    if(g.home===state.player.club||g.away===state.player.club) continue;
    record(g.home,g.away,rand(0,3),rand(0,3));
  }
}

function sortedTable(){
  return [...state.league.table].sort(
    (a,b)=>b.pts-a.pts||((b.gf-b.ga)-(a.gf-a.ga))||b.gf-a.gf
  );
}

function tableHTML(){
  return `<table>
    <thead><tr><th>Club</th><th>J</th><th>Pts</th><th>Diff.</th></tr></thead>
    <tbody>${sortedTable().map((t,i)=>`
      <tr class="${t.name===state.player.club?'mine':''}">
        <td>${i+1}. ${t.name}</td><td>${t.played}</td>
        <td>${t.pts}</td><td>${t.gf-t.ga}</td>
      </tr>`).join('')}
    </tbody>
  </table>`;
}

function statLine(label,v){
  return `<div class="stat"><span>${label}</span>
    <div class="bar"><span style="width:${clamp(v)}%"></span></div>
    <strong>${Math.round(v)}</strong></div>`;
}

function apply(effects){
  for(const [k,rawValue] of Object.entries(effects||{})){
    let v=rawValue;

    if(k==='fatigue' && v>0){
      const form=state.player.form||50;
      if(form>=80) v=Math.ceil(v*.42);
      else if(form>=70) v=Math.ceil(v*.52);
      else if(form>=60) v=Math.ceil(v*.62);
      else v=Math.ceil(v*.75);
    }

    if(['tech','speed','physical','mental','fatigue','form','coach','morale',
        'reputation','school','parents','locker','president','leadership',
        'friendship','rivalry','staffRelation','injuryProtection'].includes(k)){
      state.player[k]=clamp((state.player[k]||0)+v);
    }else{
      state.season[k]=v;
    }
  }
}

function maybeInjury(source){
  const p=state.player;
  const staffBonus=staffRecoveryBonus();
  let risk=.002+p.fatigue/(source==='match'?3400:4600)+(p.physical<40?.007:0)-staffBonus.protection;
  risk=Math.max(.001,risk);
  if(Math.random()>=risk) return false;
  const b=pick([
    {n:'contracture',w:1},{n:'élongation',w:2},
    {n:'entorse',w:3},{n:'lésion musculaire',w:4}
  ]);
  p.injury=b.n;p.injuryWeeks=b.w;p.form=clamp(p.form-10);
  log('Blessure',`${b.n}, indisponible ${b.w} journée(s).`);
  return true;
}

function simulateAbsent(reason,recovery=10){
  state = normalizeState(state);
  if(!state) return;

  const m=teamMatch();
  if(!m){
    alert("Aucun match trouvé. Le calendrier va être reconstruit.");
    const p=state.player;
    const level=p.national?'National jeunes':(p.age>=18?'Seniors régionaux':'Régional jeunes');
    state.league=makeLeague(p.club,level);
    save();render();return;
  }

  const before=state.player.fatigue;
  const h=rand(0,3),a=rand(0,3);
  record(m.home,m.away,h,a);
  simulateOthers();

  state.player.fatigue=clamp(state.player.fatigue-recovery);

  if(reason.includes('Repos')) state.player.form=clamp(state.player.form+5);
  else if(reason.includes('Suspension')) state.player.form=clamp(state.player.form-1);
  else if(reason.includes('Blessure')) state.player.form=clamp(state.player.form-2);
  else state.player.form=clamp(state.player.form+2);

  const recovered=Math.max(0,before-state.player.fatigue);

  state.season.lastResult={
    home:m.home,away:m.away,h,a,absent:true,reason,fatigueChange:-recovered
  };
  state.season.phase='result';
  log('Match sans toi',`${m.home} ${h}-${a} ${m.away}. ${reason}. Récupération : ${recovered}.`);
  save();render();
}

    alert("Aucun match trouvé pour cette journée. Le calendrier va être reconstruit.");
    const level = p.national ? 'National jeunes' : (p.age >= 18 ? 'Seniors régionaux' : 'Régional jeunes');
    state.league = makeLeague(p.club, level);
    save();
    render();
    return;
  }

  let avg=(p.tech+p.speed+p.physical+p.mental)/4;
  const compatibility=coachCompatibility();
  let perf=avg+p.form*.22+p.coach*.18-p.fatigue*.28+
    compatibility+
    (state.season.actionBonus||0)+Math.random()*32;

  let starter=perf>=62&&!state.season.forceBench;
  let note=starter
    ?(perf<72?5.5+Math.random():perf<90?6.4+Math.random()*1.2:7.7+Math.random()*1.2)
    :4.8+Math.random()*1.2;

  let g=state.season.actionGoal||0;
  let as=state.season.actionAssist||0;
  let saves=0,pen=0;
  const r=role();

  if(starter){
    if(r==='GK'){
      saves=rand(2,8);pen=Math.random()<.07?1:0;
      g=Math.max(g,Math.random()<.002?1:0);
      as=Math.max(as,Math.random()<.008?1:0);
    }else if(r==='DEF'){
      g=Math.max(g,Math.random()<.12?1:0);
      as=Math.max(as,Math.random()<.20?1:0);
    }else if(r==='MID'){
      g=Math.max(g,Math.random()<.25?1:0);
      as=Math.max(as,Math.random()<.38?1:0);
    }else{
      g=Math.max(g,Math.random()<.48?1:0);
      as=Math.max(as,Math.random()<.30?1:0);
    }
  }

  let teamGoals=Math.max(g,Math.max(0,Math.floor(Math.random()*4*(1+p.form/180-p.fatigue/320))));
  let oppGoals=r==='GK'&&perf>78?rand(0,1):rand(0,3);
  let h=m.home===p.club?teamGoals:oppGoals;
  let a=m.home===p.club?oppGoals:teamGoals;
  const finalTeamGoals=m.home===p.club?h:a;
  if(finalTeamGoals===0){g=0;as=0}else{g=Math.min(g,finalTeamGoals);as=Math.min(as,Math.max(0,finalTeamGoals-g))}
  record(m.home,m.away,h,a);
  simulateOthers();

  let card='';
  let cr=Math.random();
  if(cr<.04){p.cardsWhite++;card='Carton blanc : exclusion temporaire.';note-=.4}
  else if(cr<.075){p.cardsYellow++;card='Carton jaune.'}
  else if(cr<.09){p.cardsRed++;p.suspension=1;card='Carton rouge : suspension.';note-=1.1}

  p.matches++;p.goals+=g;p.assists+=as;p.sumRating+=note;
  if(note>=8)p.motm++;
  const fatigueBeforeMatch=p.fatigue;
  let matchFatigue;

  if(!starter){
    matchFatigue=rand(1,2);
    p.form=clamp(p.form+1);
  }else if(r==='GK'){
    matchFatigue=rand(1,3);
  }else{
    matchFatigue=rand(3,6);
  }

  if(p.form>=80) matchFatigue=Math.max(0,matchFatigue-2);
  else if(p.form>=70) matchFatigue=Math.max(1,matchFatigue-1);

  p.fatigue=clamp(p.fatigue+matchFatigue);

  if(r==='GK'){
    let conceded=m.home===p.club?a:h;
    p.saves+=saves;p.goalsConceded+=conceded;p.pensSaved+=pen;
    if(conceded===0&&starter)p.cleanSheets++;
  }

  maybeInjury('match');
  maybeLongInjury();

  state.season.lastResult={
    home:m.home,away:m.away,h,a,absent:false,starter,note,g,as,saves,pen,card,
    matchFatigue,fatigueBefore:fatigueBeforeMatch,fatigueAfter:p.fatigue
  };
  state.season.phase='result';
  log('Match',`${m.home} ${h}-${a} ${m.away}, note ${note.toFixed(1)}.`);
  save();render();
}

function strengthsAndWeaknesses(){
  const p=state.player;
  const values=[
    ['Technique',p.tech],['Vitesse',p.speed],
    ['Physique',p.physical],['Mental',p.mental],
    ['Confiance coach',p.coach],['Moral',p.morale]
  ].sort((a,b)=>b[1]-a[1]);

  const strengths=values.slice(0,3).map(x=>`${x[0]} (${Math.round(x[1])})`);
  const weaknesses=values.slice(-3).reverse().map(x=>`${x[0]} (${Math.round(x[1])})`);

  if(p.cardsRed+p.cardsYellow>3) weaknesses.push('Discipline à améliorer');
  if(p.fatigue>70) weaknesses.push('Gestion de la fatigue');
  if(p.coach>70) strengths.push('Très apprécié du coach');
  if(p.morale>75) strengths.push('État d’esprit positif');

  return {strengths,weaknesses};
}

function coupeDeFrance(){

function assessCaptaincy(){
  const p=state.player;
  const score=p.leadership*.45+p.locker*.25+p.mental*.15+p.coach*.15;

  if(score>=78 && !p.captain){
    p.captain=true;
    p.viceCaptain=false;
    log('Capitanat','Le coach te nomme capitaine de l’équipe.');
    return 'Tu deviens capitaine.';
  }

  if(score>=64 && !p.captain && !p.viceCaptain){
    p.viceCaptain=true;
    log('Capitanat','Le coach te nomme vice-capitaine.');
    return 'Tu deviens vice-capitaine.';
  }

  if((p.captain||p.viceCaptain) && (p.coach<30 || p.locker<35)){
    const old=p.captain?'capitaine':'vice-capitaine';
    p.captain=false;
    p.viceCaptain=false;
    log('Capitanat',`Tu perds ton rôle de ${old}.`);
    return `Tu perds ton rôle de ${old}.`;
  }

  return '';
}

function maybeChangeCoach(){
  const p=state.player;
  p.coachTenure++;

  let chance=.06;
  const place=sortedTable().findIndex(t=>t.name===p.club)+1;
  if(place>=8)chance+=.10;
  if(p.pro)chance+=.03;

  if(Math.random()>=chance)return '';

  const previous=p.coachProfile;
  const candidates=COACH_PROFILES.filter(c=>!previous||c.name!==previous.name);
  const next=pick(candidates);

  p.coachProfile=next;
  p.coachTenure=0;
  p.coachChanges++;
  p.coach=50;
  p.captain=false;
  p.viceCaptain=false;

  const text=`${previous?previous.name:'L’ancien entraîneur'} quitte le club. ${next.name}, profil ${next.style}, est nommé.`;
  log('Nouvel entraîneur',text);
  return text;
}

function coachCompatibility(){
  const p=state.player;
  const c=p.coachProfile;
  if(!c)return 0;

  let bonus=0;
  if(c.preference.includes('Physique'))bonus+=(p.physical-50)/10;
  if(c.preference.includes('Technique'))bonus+=(p.tech-50)/10;
  if(c.preference.includes('Mental'))bonus+=(p.mental-50)/10;
  if(c.preference.includes('Vitesse'))bonus+=(p.speed-50)/10;
  if(c.preference.includes('Vestiaire'))bonus+=(p.locker-50)/10;

  return Math.round(bonus);
}

  let candidates=Object.entries(PRO_LEAGUES)
    .filter(([name,data])=>data.prestige<=Math.max(68,p.reputation+18));

    p.club=pick(data.clubs);

function maybeLongInjury(){
  const p=state.player;
  if(!p.pro || p.longInjury || p.injuryWeeks>0)return false;

  let risk=.004;
  if(p.fatigue>75)risk+=.008;
  if(p.age>=32)risk+=.004;

  if(Math.random()>=risk)return false;

  const injuries=[
    {name:'rupture des ligaments croisés',weeks:rand(18,30)},
    {name:'fracture de la cheville',weeks:rand(12,22)},
    {name:'rupture du tendon d’Achille',weeks:rand(22,34)},
    {name:'grave lésion musculaire',weeks:rand(10,18)}
  ];
  const injury=pick(injuries);
  p.injury=injury.name;
  p.injuryWeeks=injury.weeks;
  p.longInjury=true;
  p.rehabWeeks=Math.ceil(injury.weeks*.35);
  p.returnPhase='Soins';
  p.form=clamp(p.form-25);
  p.morale=clamp(p.morale-12);
  log('Blessure longue',`${injury.name} — indisponible environ ${injury.weeks} semaines.`);
  return true;
}

function rehabilitationStep(){
  const p=state.player;
  if(!p.longInjury)return '';

  if(p.injuryWeeks>p.rehabWeeks){
    p.returnPhase='Soins et kinésithérapie';
    p.injuryWeeks=Math.max(0,p.injuryWeeks-3);
    p.fatigue=clamp(p.fatigue-12);
    return 'Soins et kinésithérapie : la blessure évolue favorablement.';
  }

  if(p.injuryWeeks>4){
    p.returnPhase='Reprise individuelle';
    p.injuryWeeks=Math.max(0,p.injuryWeeks-2);
    p.form=clamp(p.form+4);
    p.physical=clamp(p.physical+1);
    return 'Reprise individuelle : course et ballon sans contact.';
  }

  if(p.injuryWeeks>0){
    p.returnPhase='Reprise avec le groupe';
    p.injuryWeeks=Math.max(0,p.injuryWeeks-1);
    p.form=clamp(p.form+6);
    return 'Reprise avec le groupe : temps de jeu encore limité.';
  }

  p.longInjury=false;
  p.injury='';
  p.returnPhase='Apte';
  p.form=clamp(p.form+8);
  p.coach=clamp(p.coach+2);
  return 'Tu es officiellement apte à rejouer.';
}

function chooseEuropeCompetition(){
  const p=state.player;
  if(!p.pro)return '';

  const leagueData=PRO_LEAGUES[p.proLeague];
  if(!leagueData)return '';

  const place=sortedTable().findIndex(t=>t.name===p.club)+1;
  let comp='';

  if(place<=2 && leagueData.prestige>=80)comp='Ligue des Champions';
  else if(place<=4 && leagueData.prestige>=68)comp='Ligue Europa';
  else if(place<=6 && leagueData.prestige>=58)comp='Ligue Conférence';

  p.europeCompetition=comp;
  return comp;
}

function playEuropeanCampaign(){
  const p=state.player;
  const comp=chooseEuropeCompetition();
  if(!comp)return '';

  const base=
    (p.tech+p.speed+p.physical+p.mental)/4+
    p.form*.18+p.reputation*.22+p.clubPrestige*.18+
    Math.random()*28;

  let result;
  if(base>=92)result='Victoire finale';
  else if(base>=84)result='Demi-finale';
  else if(base>=76)result='Quart de finale';
  else if(base>=67)result='Huitième de finale';
  else result='Élimination en phase de groupes ou de ligue';

  const matches=result==='Victoire finale'?13:result==='Demi-finale'?11:result==='Quart de finale'?9:result==='Huitième de finale'?7:6;
  p.europeanMatches+=matches;

  if(role()==='ATT'){
    p.europeanGoals+=rand(1,Math.max(2,Math.floor(matches*.65)));
    p.europeanAssists+=rand(0,Math.max(1,Math.floor(matches*.35)));
  }else if(role()==='MID'){
    p.europeanGoals+=rand(0,Math.max(1,Math.floor(matches*.3)));
    p.europeanAssists+=rand(1,Math.max(2,Math.floor(matches*.55)));
  }else if(role()==='DEF'){
    p.europeanGoals+=rand(0,2);
    p.europeanAssists+=rand(0,2);
  }

  if(result==='Victoire finale'){
    p.titles.push(comp);
    p.reputation=clamp(p.reputation+14);
  }else if(result==='Demi-finale')p.reputation=clamp(p.reputation+8);
  else if(result==='Quart de finale')p.reputation=clamp(p.reputation+5);

  return `${comp} : ${result}.`;
}

function nationalTeamPath(){
  const p=state.player;
  if(!p.pro || p.age<18)return '';

  const score=p.reputation*.55+rating()*4+p.clubPrestige*.18+Math.random()*20;

  if(score<65){
    p.nationalStatus='Non sélectionné';
    return '';
  }

  if(score<75)p.nationalStatus='Pré-sélection';
  else if(score<86)p.nationalStatus='International rotation';
  else p.nationalStatus='Cadre de la sélection';

  if(p.internationalTeam==='Aucune'){
    const choices=[p.nationality];
    if(p.secondNationality)choices.push(p.secondNationality);
    p.internationalTeam=pick(choices);
  }

  p.internationalCaps+=rand(2,8);
  if(role()==='ATT')p.internationalGoals+=rand(0,4);
  else if(role()==='MID')p.internationalGoals+=rand(0,2);

  const comp=pick(['Ligue des Nations','Euro','Coupe du Monde']);
  p.nationalCompetition=comp;

  const strength=NATION_STRENGTH[p.internationalTeam]||72;
  const chance=(strength+p.reputation+rating()*5)/3;

  let result;
  if(chance>=89 && Math.random()<.4)result='Victoire finale';
  else if(chance>=82)result='Demi-finale ou finale';
  else if(chance>=74)result='Quart de finale';
  else result='Élimination avant les quarts';

  if(result==='Victoire finale'&&!p.titles.includes(comp))p.titles.push(comp);

  return `${comp} avec ${p.internationalTeam} : ${result}.`;
}

function calculateGoldenBall(){
  const p=state.player;
  if(!p.pro || p.clubPrestige<82){
    p.goldenBallRank=null;
    return '';
  }

  const eliteScore=
    p.reputation*.35+
    rating()*5+
    p.goals*.7+
    p.assists*.45+
    p.europeanGoals*.9+
    p.internationalGoals*.8+
    (p.titles.includes('Ligue des Champions')?14:0)+
    (p.titles.includes('Coupe du Monde')?16:0)+
    Math.random()*18;

  let rank;
  if(eliteScore>=112)rank=1;
  else if(eliteScore>=100)rank=rand(2,3);
  else if(eliteScore>=88)rank=rand(4,10);
  else if(eliteScore>=76)rank=rand(11,30);
  else rank=null;

  p.goldenBallRank=rank;

  if(rank===1){
    p.goldenBallWins++;
    const award=`🏆 Ballon d’Or ${p.goldenBallWins}`;
    if(!p.awards.includes(award))p.awards.push(award);
    return 'Tu remportes le Ballon d’Or !';
  }

  return rank?`Classement Ballon d’Or : ${rank}e.`:'';
}

function onePercentCareerEndingInjury(){
  const p=state.player;
  if(!p.pro || p.age<33 || p.careerEnded)return '';

  if(Math.random()>=.01)return '';

  p.careerEnded=true;
  p.careerEndReason='Une grave blessure met brutalement fin à ta carrière.';
  p.injury='blessure mettant fin à la carrière';
  log('Fin de carrière',p.careerEndReason);
  return p.careerEndReason;
}
function availableAgents(){
  const p=state.player;
  return AGENTS.filter(a =>
    a.level===0 ||
    (a.level===1 && (p.age>=16 || p.reputation>=18)) ||
    (a.level===2 && (p.pro || p.reputation>=40)) ||
    (a.level===3 && p.pro && p.reputation>=72)
  );
}

function chooseAgent(id){
  const p=state.player;
  const a=AGENTS.find(x=>x.id===id);
  if(!a || !availableAgents().some(x=>x.id===id)){
    p.marketMessage='Cet agent ne souhaite pas encore représenter ton dossier.';
    return;
  }
  p.agent={...a};
  p.marketMessage=`Tu signes avec ${a.name}. Commission : ${a.commission} %.`;
  log('Agent',p.marketMessage);
}

function generateMarketOffers(){
  const p=state.player;
  const max=Math.min(4,1+(p.agent.level||0));
  let count=rand(0,max);
  if(p.reputation>=70 && count===0) count=1;
  p.offers=[];

  for(let i=0;i<count;i++){
    const eligible=PRO_LEVELS.filter(x=>p.reputation>=x.min-15);
    const level=eligible.length?pick(eligible):PRO_LEVELS[0];
    const loan=Math.random()<.28 && p.age<=25;
    p.offers.push({
      id:`o${Date.now()}${i}${rand(10,99)}`,
      club:pick(level.clubs),level:level.name,
      years:pick([2,3]),
      monthly:rand(1800,15000),
      signingBonus:rand(3000,45000),
      role:pick(['Remplaçant','Rotation','Titulaire potentiel','Titulaire']),
      loan,purchaseOption:loan&&Math.random()<.55,
      status:'active',countered:false
    });
  }
  p.marketMessage=p.offers.length?`${p.offers.length} offre(s) reçue(s).`:'Aucune offre reçue.';
  log('Mercato',p.marketMessage);
}

function acceptMarketOffer(id){
  const p=state.player,o=p.offers.find(x=>x.id===id&&x.status==='active');
  if(!o)return;
  const old=p.club;
  if(o.loan){
    p.loan={parentClub:old,loanClub:o.club,remaining:1,purchaseOption:o.purchaseOption,monthly:o.monthly};
    p.club=o.club;
    p.marketMessage=`Prêt accepté à ${o.club}${o.purchaseOption?' avec option d’achat':''}.`;
  }else{
    p.club=o.club;
    p.contract={club:o.club,years:o.years,remaining:o.years,monthly:o.monthly,signingBonus:o.signingBonus,role:o.role};
    p.balance+=o.signingBonus;p.totalIncome+=o.signingBonus;p.freeAgent=false;
    p.marketMessage=`Contrat signé à ${o.club} pour ${o.years} ans.`;
  }
  p.transferHistory.push({age:p.age,from:old,to:p.club,type:o.loan?'Prêt':'Transfert'});
  p.offers.forEach(x=>x.status=x.id===id?'accepted':'withdrawn');
  log('Signature',p.marketMessage);
}

function rejectMarketOffer(id){
  const o=state.player.offers.find(x=>x.id===id);
  if(!o)return;
  o.status='rejected';
  state.player.marketMessage=`Offre de ${o.club} refusée.`;
}

function negotiateMarketOffer(id,type){
  const p=state.player,o=p.offers.find(x=>x.id===id&&x.status==='active');
  if(!o)return;
  const chance=.50+(p.agent.level||0)*.10+p.reputation/500-(o.countered?.15:0);
  if(Math.random()>chance){
    if(Math.random()<.3){o.status='withdrawn';p.marketMessage=`${o.club} retire son offre.`}
    else{p.marketMessage=`${o.club} refuse la demande mais maintient l’offre.`;o.countered=true}
    return;
  }
  if(type==='salary')o.monthly=Math.round(o.monthly*1.12/100)*100;
  if(type==='bonus')o.signingBonus=Math.round(o.signingBonus*1.25/100)*100;
  if(type==='role')o.role='Titulaire potentiel';
  if(type==='years')o.years=3;
  o.countered=true;
  p.marketMessage=`${o.club} accepte ta contre-proposition.`;
}

function requestTransfer(){
  const p=state.player;
  p.transferRequestActive=true;
  p.marketMessage=p.coach>=65
    ?'Le club accepte d’écouter les offres, mais souhaite te conserver.'
    :'Le club te place sur la liste des transferts.';
  generateMarketOffers();
}

function cancelTransfer(){
  const p=state.player;
  p.transferRequestActive=false;
  p.marketMessage='Tu retires ta demande de transfert.';
}

function terminateContract(){
  const p=state.player;
  if(!p.contract)return;
  const chance=.08+(p.coach<25?.25:0)+(p.transferRequestActive?.15:0);
  if(Math.random()<chance){
    p.contract=null;p.freeAgent=true;
    p.marketMessage='Résiliation acceptée : tu es joueur libre.';
  }else p.marketMessage='Le club refuse la rupture anticipée.';
}

function prepareRegionalTrials(){
  const p=state.player;
  p.clubTrials=[...REGIONAL_TRIAL_CLUBS].sort(()=>Math.random()-.5).slice(0,3)
    .map(c=>({...c,status:'pending',message:'Essai à effectuer'}));
  p.regionalDecisionPending=true;
  p.marketMessage='Trois clubs te proposent un essai.';
}

function runRegionalTrial(i){
  const p=state.player,t=p.clubTrials[i];
  if(!t||t.status!=='pending')return;
  const need=t.need.includes(p.pos)?15:0;
  const score=(p.tech+p.speed+p.physical+p.mental)/4*.6+p.form*.15+p.reputation*.1+need+Math.random()*17;
  if(score>=78){t.status='accepted';t.message='Le club insiste pour te recruter et promet une place importante.'}
  else if(score>=66){t.status='accepted';t.message='Essai réussi : une licence est proposée.'}
  else if(score>=58){t.status='wait';t.message='Liste d’attente.'}
  else{t.status='rejected';t.message='Essai non concluant.'}
  p.marketMessage=`${t.name} : ${t.message}`;
}

function signRegionalTrial(i){
  const p=state.player,t=p.clubTrials[i];
  if(!t||t.status!=='accepted')return;
  const old=p.club;p.club=t.name;
  p.transferHistory.push({age:p.age,from:old,to:p.club,type:'Mutation régionale'});
  p.regionalDecisionPending=false;p.licenseRenewed=true;
  p.marketMessage=`Tu signes ta licence à ${p.club}.`;
}

function renewRegionalLicense(){
  const p=state.player;
  p.regionalDecisionPending=false;p.licenseRenewed=true;
  p.marketMessage=`Tu reprends une licence au ${p.club}.`;
  p.coach=clamp(p.coach+3);
}

function processLoanEnd(){
  const p=state.player;
  if(!p.loan)return '';
  p.loan.remaining--;
  if(p.loan.remaining>0)return '';
  const l={...p.loan};
  if(l.purchaseOption&&Math.random()<.55){
    p.contract={club:l.loanClub,years:3,remaining:3,monthly:Math.round(l.monthly*1.15),signingBonus:rand(4000,18000),role:'Rotation'};
    p.balance+=p.contract.signingBonus;p.totalIncome+=p.contract.signingBonus;p.loan=null;
    return `${l.loanClub} lève l’option d’achat.`;
  }
  p.club=l.parentClub;p.loan=null;
  return `Fin du prêt : retour à ${p.club}.`;
}

function annualFinances(){const p=state.player;let income=0,expenses=0;if(p.pro&&p.contract){income=p.contract.monthly*12;expenses=Math.round(income*(p.agent.commission||0)/100)+rand(6000,18000)}else if(p.amateur){income=rand(0,4000);expenses=rand(1500,6000)}else expenses=rand(300,1500);p.balance+=income-expenses;p.totalIncome+=income;p.totalExpenses+=expenses;return{income,expenses}}
function endSeason(){
  if(state.season.seasonProcessed) return;
  state.season.seasonProcessed=true;
  const p=state.player;
  const place=sortedTable().findIndex(t=>t.name===p.club)+1;
  const gain=Math.max(
    2,
    Math.floor((rating()-6)*7)+p.goals+p.assists+p.motm*2+(place<=3?6:0)
  );

  p.reputation=clamp(p.reputation+gain);

  let extras=[];

  if(p.age===13&&!p.poleAttempted){
    p.poleAttempted=true;
    const score=((p.tech+p.speed+p.physical+p.mental)/4)*.45+p.potential*.18+p.mental*.12+p.coach*.10+Math.max(0,rating()-5)*4+Math.random()*14;
    p.poleScore=Math.round(score);
    if(score>=83){p.pole=true;p.national=true;p.poleStatus='Retenu parmi les 23';p.club='Pôle Espoirs de Castelmaurou';state.season.special=`Retenu parmi les 23 joueurs. Évaluation : ${p.poleScore}/100.`}
    else if(score>=72){p.pole=false;p.poleStatus='Attention : doit progresser';state.season.special=`Attention, doit progresser. Évaluation : ${p.poleScore}/100. Retour en régional.`;state.season.regionalClubChoice=true}
    else{p.pole=false;p.poleStatus='Non retenu';state.season.special=`Non retenu. Évaluation : ${p.poleScore}/100. Choisis un club régional.`;state.season.regionalClubChoice=true}
    extras.push(state.season.special);log('Castelmaurou',state.season.special);
  }

  let tournament=null;
  if(p.age===14&&!p.pole)tournament='Tournoi des Violettes au Stadium';
  if(p.age===15)tournament='Tournoi international de Blanes';
  if(p.age===16||p.age===17)tournament='Tournoi de Cahors';

  if(tournament&&!p.tournaments.includes(tournament)){
    p.tournaments.push(tournament);
    const perf=(p.tech+p.speed+p.physical+p.mental)/4+p.form*.2+p.coach*.15+Math.random()*30;
    const result=perf>=88?'finale et révélation du tournoi':
      perf>=74?'demi-finale':perf>=62?'quart de finale':'phase de poules';

    let text=`${tournament} : ${result}.`;
    p.reputation=clamp(p.reputation+(perf>=88?12:perf>=74?7:perf>=62?3:1));

    if(perf>=74){
      const eligible=PRO_LEVELS.filter(x=>p.reputation>=x.min);
      if(eligible.length){
        const lev=eligible[eligible.length-1],club=pick(lev.clubs);
        p.academy=`${club} - Centre de formation`;
        p.club=p.academy;p.national=true;
        text+=` Un recruteur de ${club} te fait signer en centre de formation (${lev.name}).`;
      }
    }
    extras.push(text);
    log(tournament,text);
  }

  const gamb=gambardella();
  if(gamb){extras.push(gamb);log('Gambardella',gamb)}

  const cdf=coupeDeFrance();
  if(cdf){extras.push(cdf);log('Coupe de France',cdf)}

  const captainResult=assessCaptaincy();
  if(captainResult)extras.push(captainResult);

  const conflictResult=conflictConsequences();
  if(conflictResult)extras.push(conflictResult);

  const coachResult=maybeChangeCoach();
  if(coachResult)extras.push(coachResult);

  const careerEnd=onePercentCareerEndingInjury();
  if(careerEnd)extras.push(careerEnd);

  const euroResult=playEuropeanCampaign();
  if(euroResult){extras.push(euroResult);log('Europe',euroResult)}

  const nationalResult=nationalTeamPath();
  if(nationalResult){extras.push(nationalResult);log('Sélection',nationalResult)}

  const goldenResult=calculateGoldenBall();
  if(goldenResult){extras.push(goldenResult);log('Ballon d’Or',goldenResult)}

  const loanResult=processLoanEnd();if(loanResult){extras.push(loanResult);log('Prêt',loanResult)}

  const awards=awardSeason();if(awards.length)extras.push('Récompenses : '+awards.join(', '));const pathDecision=decideCareerPath();if(pathDecision)extras.push(pathDecision);if(p.pro&&p.contract){p.contract.remaining--;if(p.contract.remaining<=1){const offers=generateOffers();extras.push(offers.length?`${offers.length} proposition(s) reçue(s).`:'Aucune proposition reçue.')}}if(p.age>=18&&p.amateur&&!p.licenseRenewed)p.regionalDecisionPending=true;
  const finance=annualFinances();extras.push(`Finances : +${finance.income.toLocaleString('fr-FR')} € / -${finance.expenses.toLocaleString('fr-FR')} €.`);const intl=internationalCompetition();
  if(intl){extras.push(intl);log('Sélection',intl)}

  detectProfile();

  state.season.endReport=reportHTML('Bilan de fin de saison');
  state.season.endExtras=extras.join('<br><br>');
  p.history.push({
    age:p.age,club:p.club,level:state.league.level,matches:p.matches,
    goals:p.goals,assists:p.assists,rating:rating().toFixed(1),place
  });

  log('Bilan de saison',`Place ${place}/10, réputation +${gain}.`);
  save();
}

function resetWeek(){
  state = normalizeState(state);

  if(!state){
    alert("La carrière est invalide. Commence une nouvelle carrière.");
    localStorage.removeItem(SAVE_KEY);
    show('home');
    return;
  }

  const s = state.season;
  const p = state.player;

  s.round = Math.max(1, Number(s.round) || 1) + 1;

  s.weekEvent = null;
  s.trainingEvent = null;
  s.preMatch = null;
  s.matchAction = null;
  s.lastResult = null;
  s.forceBench = false;
  s.actionBonus = 0;
  s.actionGoal = 0;
  s.actionAssist = 0;
  s.restDecision = false;

  if(p.suspension > 0) p.suspension--;

  const naturalRecovery=p.form>=75?7:p.form>=60?5:3;
  const staffBonus=staffRecoveryBonus();
  p.fatigue=clamp(p.fatigue-naturalRecovery-staffBonus.recovery);

  if(s.round === 10 && !s.midReportDone){
    s.midReport = reportHTML('Bilan de mi-saison');
    s.midReportDone = true;
    s.phase = 'midReport';
  }else{
    s.phase = 'life';
  }

  save();
  render();
}

    return;
  }

  if(s.phase==='midReport'){
    box.innerHTML=`${s.midReport}<div class="card"><button data-act="continueMid">Continuer la saison</button></div>`;
    return;
  }

  if(p.injuryWeeks>0&&s.phase!=='result'){
    if(p.longInjury){
      box.innerHTML=`<div class="card pro-card">
        <h2>🚑 Blessure longue</h2>
        <p><strong>${p.injury}</strong></p>
        <p>Phase : ${p.returnPhase}</p>
        <p>Estimation restante : ${p.injuryWeeks} semaine(s).</p>
        <button data-act="rehab">Poursuivre la rééducation</button>
      </div>`;
    }else{
      box.innerHTML=`<div class="card">
        <h2>🚑 Blessure</h2>
        <p>${p.injury} : encore ${p.injuryWeeks} journée(s).</p>
        <button data-act="injuredAbsent">Voir le match joué sans toi</button>
      </div>`;
    }
    return;
  }

  if(p.suspension>0&&s.phase!=='result'){
    box.innerHTML=`<div class="card">
      <h2>🟥 Suspension</h2>
      <p>Tu es suspendu pour cette rencontre.</p>
      <button data-act="suspendedAbsent">Voir le match joué sans toi</button>
    </div>`;
    return;
  }

  if(s.phase==='life'){
    createWeekEvent();
    if(s.weekEvent){
      box.innerHTML=`<div class="card choice">
        <h2>${s.weekEvent.title}</h2>
        <p>${s.weekEvent.text}</p>
        ${s.weekEvent.choices.map((c,i)=>`
          <button data-act="lifeChoice" data-i="${i}">${c[0]}</button>`).join('')}
      </div>`;
    }else{
      box.innerHTML=`<div class="card">
        <h2>Début de semaine</h2>
        <p>Une semaine calme commence. Le coach observe simplement ton état de forme.</p>
        <button data-act="goTraining">Aller à l’entraînement</button>
      </div>`;
    }
    return;
  }

  if(s.phase==='training'){
    if(!s.trainingEvent)s.trainingEvent=trainingEvent();
    box.innerHTML=`<div class="card choice">
      <h2>${s.trainingEvent.title}</h2>
      <div class="message">${s.trainingEvent.text}</div>
      ${s.trainingEvent.choices.map((c,i)=>`
        <button data-act="trainingChoice" data-i="${i}">${c[0]}</button>`).join('')}
    </div>`;
    return;
  }

  if(s.phase==='prematch'){
    if(hotelBeforeBigGame() && !s.hotelShown){
      s.hotelShown=true;
      s.weekEvent=pick(HOTEL_EVENTS);
      box.innerHTML=`<div class="card choice">
        <h2>🏨 ${s.weekEvent.title}</h2>
        <p>${s.weekEvent.text}</p>
        ${s.weekEvent.choices.map((c,i)=>`
          <button data-act="hotelChoice" data-i="${i}">${c[0]}</button>`).join('')}
      </div>`;
      return;
    }

    if(state.league.level==='Seniors régionaux'){
      const derby=currentDerby();
      if(derby && !s.derbyShown){
        s.derbyShown=true;
        s.lastActionMessage=`🔥 ${derby.name} : supporters, tambours et buvette pleine.`;
        log('Derby',s.lastActionMessage);
      }
    }
    preMatchEvent();
    if(s.preMatch){
      box.innerHTML=`<div class="card choice">
        <h2>${s.preMatch.title}</h2>
        <p>${s.preMatch.text}</p>
        ${s.preMatch.choices.map((c,i)=>`
          <button data-act="preChoice" data-i="${i}">${c[0]}</button>`).join('')}
      </div>`;
    }else{
      s.phase='action';save();render();
    }
    return;
  }

  if(s.phase==='action'){
    matchAction();
    const a=s.matchAction;
    box.innerHTML=`<div class="card choice">
      ${s.lastActionMessage?`<div class="message">${s.lastActionMessage}</div>`:''}
      <h2>⚽ ${a.minute}e minute</h2>
      <p class="big">${a.text}</p>
      ${a.choices.map((c,i)=>`
        <button data-act="actionChoice" data-i="${i}">${c[0]}</button>`).join('')}
    </div>`;
    return;
  }

  if(s.phase==='ready'){
    const actionFeedback=s.lastActionMessage?`<div class="message">${s.lastActionMessage}</div>`:'';
    if((p.fatigue>=50||p.form<=60)&&!s.restDecision){
      box.innerHTML=`<div class="card">${actionFeedback}

  if(s.phase==='result'){
    const r=s.lastResult;
    box.innerHTML=`<div class="card">
      <h2>Résultat</h2>
      <div class="score">${r.home} ${r.h} - ${r.a} ${r.away}</div>

function handlePreseasonChoice(index){
  if(!state){
    alert("Aucune carrière active.");
    return;
  }

  state=normalizeState(state);

  const option=preseasonOptions()[Number(index)];
  if(!option){
    alert("Préparation introuvable.");
    return;
  }

  const p=state.player;
  const s=state.season;

  /*
    Les candidatures incertaines ne sont plus refusées automatiquement.
    Leur chance dépend du niveau moyen, de l'âge et de la réputation.
  */
  if(!option.admitted){
    const average=(p.tech+p.speed+p.physical+p.mental)/4;
    const chance=clamp(
      .18 + (average-45)/110 + p.reputation/220 + Math.max(0,p.age-13)*.025,
      .12,
      .72
    );

    if(Math.random()>=chance){
      log(
        'Candidature refusée',
        `${option.name} : candidature non retenue cette année.`
      );
      alert(
        `Candidature non retenue pour ${option.name}. ` +
        `Tu dois choisir une autre préparation.`
      );
      save();
      render();
      return;
    }

    log(
      'Candidature acceptée',
      `${option.name} : tu es retenu malgré une candidature incertaine.`
    );
  }

  p.seasonStartStats={
    tech:p.tech,
    speed:p.speed,
    physical:p.physical,
    mental:p.mental
  };

  apply(option.effects);

  log(
    'Préparation estivale',
    `${option.name}, avant la première journée de championnat.`
  );

  s.preseasonDone=true;
  s.round=1;
  s.phase='life';

  save();
  render();
}

/* Compatibilité avec d'anciens appels éventuels. */
function choosePreseason(index){
  handlePreseasonChoice(index);
}


document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(!b || !state) return;

  e.preventDefault();

  state = normalizeState(state);
  if(!state){
    alert("La sauvegarde est invalide.");
    localStorage.removeItem(SAVE_KEY);
    show('home');
    return;
  }

  const a = b.dataset.act;
  const p = state.player;
  const s = state.season;

  if(a==='preseasonChoice'){
    handlePreseasonChoice(+b.dataset.i);
  }

  else if(a==='lifeChoice'){
    const c=s.weekEvent.choices[+b.dataset.i];
    apply(c[1]);

    if(c[1].risk&&Math.random()<c[1].risk)maybeInjury('training');

    if(
      LOCKER_EVENTS.includes(s.weekEvent) ||
      TRAVEL_EVENTS.includes(s.weekEvent) ||
      HOTEL_EVENTS.includes(s.weekEvent) ||
      CARE_EVENTS.includes(s.weekEvent) ||
      CAPTAIN_EVENTS.includes(s.weekEvent)
    ){
      recordImmersionEvent(s.weekEvent,c[0]);
    }

    log(s.weekEvent.title,`Choix : ${c[0]}`);
    s.phase=c[1].skipTraining?'prematch':'training';
    save();render();
  }

  else if(a==='goTraining'){
    s.phase='training';render();
  }

  else if(a==='trainingChoice'){
    const c=s.trainingEvent.choices[+b.dataset.i];
    apply(c[1]);log(s.trainingEvent.title,`Choix : ${c[0]}`);
    maybeInjury('training');
    s.phase='prematch';save();render();
  }

  else if(a==='preChoice'){
    const c=s.preMatch.choices[+b.dataset.i];
    apply(c[1]);
    if(c[1].risk&&Math.random()<c[1].risk)maybeInjury('match');
  maybeLongInjury();
    log(s.preMatch.title,`Choix : ${c[0]}`);
    s.phase='action';save();render();
  }

  else if(a==='actionChoice'){
    const ac=s.matchAction;
    const choice=ac.choices[+b.dataset.i];
    const stat=choice[1],style=choice[2];

    p.styleCounters[style]=(p.styleCounters[style]||0)+1;

    let success=.45+(p[stat]-50)/120;
    if(choice[0].includes('Panenka')) success-=.10;
    if(choice[0].includes('Pleine lucarne')) success-=.08;
    if(choice[0].includes('faute tactique')) success=.70;

    const ok=Math.random()<clamp(success,.12,.88);
    s.actionBonus=ok?8:-4;

    if(ok&&role()==='ATT'){
      if(choice[0].includes('Passe'))s.actionAssist=1;
      else if(!choice[0].includes('laisse'))s.actionGoal=Math.random()<.62?1:0;
    }

    if(ok&&role()==='MID'){
      if(choice[0].includes('Passe')||choice[0].includes('Transversale')||choice[0].includes('profondeur'))s.actionAssist=Math.random()<.45?1:0;
      if(choice[0].includes('frappe'))s.actionGoal=Math.random()<.28?1:0;
    }

    let feedback=ok?`✅ Tu réussis : ${choice[0]}.`:`❌ Tu rates : ${choice[0]}.`; if(ok&&s.actionGoal)feedback+=' Tu marques !'; if(ok&&s.actionAssist)feedback+=' Ta passe devient décisive.'; if(!ok&&choice[0].includes('Passe'))feedback+=' Le ballon est intercepté.'; s.lastActionMessage=feedback; log(`${ac.minute}e minute`,feedback); s.phase='ready';save();render();
  }

  else if(a==='rest'){
    simulateAbsent('Repos demandé en raison d’une forte fatigue',25);
  }

  else if(a==='playTired'){
    s.restDecision=true;render();
  }

  else if(a==='play'){
    playMatch();
  }

  else if(a==='nextRound'){
    resetWeek();
  }

  else if(a==='forceNextRound'){
    state.season.phase = 'life';
    resetWeek();
  }

  else if(a==='injuredAbsent'){
    const injuryName = p.injury || 'Blessure';
    p.injuryWeeks = Math.max(0, (Number(p.injuryWeeks) || 1) - 1);
    if(p.injuryWeeks === 0) p.injury = '';
    simulateAbsent(`Blessure : ${injuryName}`,15);
  }

  else if(a==='suspendedAbsent'){
    simulateAbsent('Suspension',0);
  }

  else if(a==='continueMid'){
    s.phase='life';save();render();
  }

  else if(a==='regionalClub'){p.club=b.dataset.club;p.national=false;s.regionalClubChoice=false;log('Nouveau club régional',`Tu rejoins ${p.club}.`);save();render()}
  else if(a==='hotelChoice'){
    const c=s.weekEvent.choices[+b.dataset.i];
    apply(c[1]);
    recordImmersionEvent(s.weekEvent,c[0]);
    log(s.weekEvent.title,`Choix : ${c[0]}`);
    s.hotelShown=true;
    s.weekEvent=null;
    save();render();
  }

  else if(a==='rehab'){
    const message=rehabilitationStep();
    log('Rééducation',message);
    save();render();
  }

  else if(a==='agent'){chooseAgent(b.dataset.id);save();render()}
  else if(a==='offers'){generateMarketOffers();save();render()}
  else if(a==='acceptOffer'){acceptMarketOffer(b.dataset.id);save();render()}
  else if(a==='rejectOffer'){rejectMarketOffer(b.dataset.id);save();render()}
  else if(a==='salary'){negotiateMarketOffer(b.dataset.id,'salary');save();render()}
  else if(a==='bonus'){negotiateMarketOffer(b.dataset.id,'bonus');save();render()}
  else if(a==='role'){negotiateMarketOffer(b.dataset.id,'role');save();render()}
  else if(a==='requestTransfer'){requestTransfer();save();render()}
  else if(a==='cancelTransfer'){cancelTransfer();save();render()}
  else if(a==='terminate'){terminateContract();save();render()}
  else if(a==='renew'){renewRegionalLicense();save();render()}
  else if(a==='trials'){prepareRegionalTrials();save();render()}
  else if(a==='trial'){runRegionalTrial(+b.dataset.i);save();render()}
  else if(a==='signTrial'){signRegionalTrial(+b.dataset.i);save();render()}
  else if(a==='competitionReaction'){
    const c=state.competitions.active.find(x=>x.id===s.activeCompetitionId);
    const choice=b.dataset.choice;
    if(choice==='confident'){p.morale=clamp(p.morale+2);p.reputation=clamp(p.reputation+1)}
    if(choice==='respect'){p.mental=clamp(p.mental+2);p.coach=clamp(p.coach+1)}
    if(choice==='ambitious'){p.reputation=clamp(p.reputation+2);p.fatigue=clamp(p.fatigue+1)}
    log('Tirage au sort',`${c.name} : ${p.club} contre ${c.opponent}.`);
    s.phase='competitionReady';save();render();
  }

  else if(a==='playCompetition'){
    const c=state.competitions.active.find(x=>x.id===s.activeCompetitionId);
    if(!c)return;
    playCompetitionMatch(c);
    save();render();
  }

  else if(a==='continueAfterCompetition'){
    s.lastCompetitionResult=null;
    s.activeCompetitionId='';
    s.phase='life';
    save();render();
  }

  else if(a==='nextSeason'){
    if(s.regionalClubChoice){alert('Choisis d’abord ton club régional.');return}
    if(p.age>=18&&p.amateur&&p.regionalDecisionPending&&!p.licenseRenewed){
      alert('Décide d’abord où tu prends ta licence dans l’onglet Mercato.');return
    }
    nextSeason();
  }
});

window.addEventListener('error', event => {
  console.error('TCROMA ACADEMY:', event.error || event.message);
});

window.addEventListener('unhandledrejection', event => {
  console.error('TCROMA ACADEMY Promise:', event.reason);
});

show('home');
</script>
</body>
</html>
