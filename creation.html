<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Création du joueur - TCROMA ACADEMY</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="carte">
      <h1>⚽ Création du joueur</h1>

      <div class="grille">
        <div>
          <label for="prenom">Prénom</label>
          <input id="prenom" type="text" placeholder="Thomas">
        </div>

        <div>
          <label for="nom">Nom</label>
          <input id="nom" type="text" placeholder="Navarro">
        </div>
      </div>

      <label for="poste">Poste</label>
      <select id="poste">
        <option value="">Choisir un poste</option>
        <option>Gardien</option>
        <option>Défenseur central</option>
        <option>Latéral droit</option>
        <option>Latéral gauche</option>
        <option>Milieu défensif</option>
        <option>Milieu relayeur</option>
        <option>Meneur de jeu</option>
        <option>Ailier droit</option>
        <option>Ailier gauche</option>
        <option>Attaquant</option>
      </select>

      <label for="departement">Département</label>
      <select id="departement">
        <option value="">Choisir un département</option>
        <option value="31">31 - Haute-Garonne</option>
        <option value="81">81 - Tarn</option>
        <option value="82">82 - Tarn-et-Garonne</option>
        <option value="11">11 - Aude</option>
        <option value="09">09 - Ariège</option>
        <option value="34">34 - Hérault</option>
      </select>

      <label for="club">Club de départ</label>
      <select id="club">
        <option value="">Choisir d'abord un département</option>
      </select>

      <button id="commencer">Commencer ma carrière</button>
      <button class="secondaire" onclick="window.location.href='index.html'">Retour</button>
    </section>
  </main>

  <script src="donnees.js"></script>
  <script src="creation.js"></script>
</body>
</html>
